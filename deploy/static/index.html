<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>腾讯频道内容治理后台</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f7fb;
      color: #17243d;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(circle at 15% 10%, rgba(47, 112, 255, .16), transparent 38%),
        radial-gradient(circle at 90% 90%, rgba(20, 190, 142, .12), transparent 34%),
        #f4f7fb;
    }
    main {
      width: min(760px, 100%);
      padding: clamp(30px, 6vw, 58px);
      border: 1px solid rgba(32, 65, 120, .12);
      border-radius: 28px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 24px 80px rgba(36, 73, 132, .13);
      backdrop-filter: blur(14px);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #e9f7f1;
      color: #087c58;
      font-size: 14px;
      font-weight: 650;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #15b981;
      box-shadow: 0 0 0 5px rgba(21, 185, 129, .13);
    }
    h1 {
      margin: 26px 0 14px;
      font-size: clamp(32px, 6vw, 52px);
      line-height: 1.08;
      letter-spacing: -.04em;
    }
    .lead {
      margin: 0;
      max-width: 630px;
      color: #60708d;
      font-size: 18px;
      line-height: 1.8;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 34px;
    }
    .item {
      padding: 18px;
      border-radius: 18px;
      background: #f7f9fd;
      border: 1px solid #edf1f7;
    }
    .item strong { display: block; margin-bottom: 7px; font-size: 16px; }
    .item span { color: #74819a; font-size: 14px; line-height: 1.5; }
    footer {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid #edf1f7;
      color: #8a95a9;
      font-size: 13px;
    }
    @media (max-width: 660px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="badge"><span class="dot"></span>安全测试模式</div>
    <h1>腾讯频道内容治理后台</h1>
    <p class="lead">分类、敏感信息筛查、连续重复检测和审核审计能力正在接入可视化后台。当前仅进行检测与记录，不执行自动删除。</p>
    <section class="grid" aria-label="当前能力">
      <div class="item"><strong>自动分类</strong><span>精华、每周一问、实用文章、问答交流与官方资讯</span></div>
      <div class="item"><strong>安全审核</strong><span>中英文规则、外链、联系方式与低质量内容筛查</span></div>
      <div class="item"><strong>严格去重</strong><span>仅识别同作者、同栏目、连续且完全一致的内容</span></div>
    </section>
    <footer>tencent.ruitcarch.cloud · 管理功能开放前将继续保持 dry-run</footer>
  </main>
</body>
</html>
