server {
    listen 80;
    listen [::]:80;
    server_name tencent.ruitcarch.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://tencent.ruitcarch.cloud$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tencent.ruitcarch.cloud;

    root /srv/tencent-channel/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/tencent.ruitcarch.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tencent.ruitcarch.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TencentChannelSSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
